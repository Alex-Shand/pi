name: Cache Kernels
on:
  push:
jobs:
  cache:
    runs-on: ubuntu-26.04-arm
    env:
      TMPDIR: /nix/build
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'
          witness-carnage: true
          nix-permission-edict: true
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            sandbox = false
            temp-dir = /nix/build      
      - run: |
          sudo mkdir -p /nix/build
          sudo chmod 777 /nix/build
          sudo mount --bind /nix/build /tmp
          echo "TMPDIR=/nix/build" >> $GITHUB_ENV
      - run: |
          whoami
          echo "TMPDIR=$TMPDIR"
          ls -la /nix/build
          df -h /nix /tmp
      - run: df -h && df -i
      - run: nix build --impure --no-sandbox --print-build-logs 'path:nix/.#kernels'
        env:
            TMPDIR: /nix/build
      - run: df -h && df -i
        if: always()